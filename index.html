    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="VoidSurvivor" />

    <meta name="description" content="Survive endless alien swarms in the deep cosmos. Auto-attack weapons, upgrade skills, vacuum gems, and dominate the alien planet in Void Survivor." />
    <meta property="og:title" content="Void Survivor — Action Roguelite Survival" />

    <script>
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>

  <body class="bg-[#05060b] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 overflow-hidden select-none">

  </body>
